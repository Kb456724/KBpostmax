<!DOCTYPE html>
<html>
<head>
<link rel="manifest" href="manifest.json">
  <title>KBpost</title>
  <style>
    :root {
      --bg: #f7f9fa; --card: #ffffff; 
      --txt: #0f1419; --border: #eff3f4; 
      --accent: #1d9bf0; --sub: #536471;
    }
    [data-theme="dark"] {
      --bg: #0f172a; --card: #1e293b; 
      --txt: #f8fafc; --border: #334155; 
      --accent: #38bdf8; --sub: #94a3b8;
    }
    body {
      background-color: var(--bg); 
      color: var(--txt); margin: 0; 
      font-family: Arial, sans-serif; 
      display: flex; justify-content: center;
    }
    .app-frame {
      width: 100%; max-width: 420px; 
      background-color: var(--card);
      min-height: 100vh; position: relative;
      padding-bottom: 120px;
    }
    .header {
      padding: 15px; font-size: 22px; 
      font-weight: bold; color: var(--accent);
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between;
      align-items: center;
    }
    .box { padding: 20px; text-align: center; }
    .input {
      width: 90%; padding: 10px; 
      background-color: var(--bg);
      border: 1px solid var(--border); 
      border-radius: 8px; color: var(--txt);
      margin-bottom: 12px; font-size: 14px;
    }
    .btn {
      background-color: var(--accent); 
      color: white; border: none; font-size: 14px;
      padding: 10px; border-radius: 20px; 
      font-weight: bold; cursor: pointer; 
      width: 95%; margin-bottom: 10px;
    }
    .card {
      border-bottom: 6px solid var(--bg); 
      padding-bottom: 12px; background: var(--card);
    }
    .p-head { 
      display: flex; align-items: center; 
      padding: 10px; justify-content: space-between;
    }
    .circle { 
      width: 32px; height: 32px; border-radius: 50%; 
      background: var(--accent); margin-right: 8px; 
    }
    .user { font-weight: bold; font-size: 14px; }
    .f-btn {
      background: none; border: 1px solid var(--accent);
      color: var(--accent); border-radius: 12px;
      padding: 4px 10px; cursor: pointer; 
      font-size: 11px; font-weight: bold;
    }
    /* STYLES THE FULL SIZE PHOTO/VIDEO WINDOW */
    .media-box { 
      width: 100%; max-height: 450px; 
      overflow: hidden; background: #000; 
      display: flex; align-items: center;
    }
    .media { 
      width: 100%; height: auto; 
      display: block; 
    }
    .caption { padding: 10px; font-size: 14px; }
    .actions { 
      padding: 0 10px; display: flex; gap: 15px; 
    }
    .act-btn { 
      background: none; border: none; cursor: pointer; 
      padding: 5px 0; display: flex; align-items: center;
    }
    .act-btn svg { 
      width: 22px; height: 22px; fill: none; 
      stroke: var(--txt); stroke-width: 2; 
    }
    .nav {
      position: fixed; bottom: 0; width: 100%; 
      max-width: 420px; height: 60px; z-index: 100;
      background: var(--card); display: flex; 
      border-top: 1px solid var(--border);
      justify-content: space-around; align-items: center;
    }
    .nav-btn { 
      background: none; border: none; cursor: pointer; 
      padding: 10px; display: flex; align-items: center;
    }
    .nav-btn svg { 
      width: 24px; height: 24px; fill: none; 
      stroke: var(--txt); stroke-width: 2; 
    }
    .hidden { display: none !important; }
    .grid { 
      display: grid; grid-template-columns: repeat(3, 1fr); 
      gap: 4px; padding-top: 10px; 
    }
    .grid-img { 
      width: 100%; aspect-ratio: 1; object-fit: cover; 
      background: var(--bg); border-radius: 4px; 
    }
    .dm-drawer {
      position: fixed; bottom: 60px; width: 100%; 
      max-width: 420px; background: var(--card); 
      border-top: 1px solid var(--border); 
      box-shadow: 0 -3px 10px rgba(0,0,0,0.05); 
      transition: height 0.3s ease; height: 40px; z-index: 99;
    }
    .dm-drawer.open { height: 280px; }
    .dm-head {
      padding: 10px 15px; font-weight: bold; 
      background: var(--accent); color: white;
      display: flex; justify-content: space-between; 
      cursor: pointer; font-size: 14px;
    }
    .dm-chat { 
      padding: 10px; height: 160px; overflow-y: auto; 
      display: flex; flex-direction: column; gap: 6px; 
    }
    .bubble { 
      padding: 6px 10px; border-radius: 12px; 
      max-width: 70%; font-size: 13px; 
    }
    .sent { background: var(--accent); color: white; align-self: flex-end; }
    .recv { background: var(--bg); color: var(--txt); align-self: flex-start; }
  </style>
</head>
<body>
  <div class="app-frame">
    <div class="header">
      <span>KBpost</span>
      <button onclick="toggleTheme()" style="background:none; border:none; cursor:pointer; font-size:16px;">🌓</button>
    </div>

    <div id="authPanel" class="box">
      <h3 id="modeTitle">Create Account</h3>
      <input type="email" id="email" class="input" placeholder="Email">
      <input type="password" id="pass" class="input" placeholder="Password">
      <button class="btn" id="subBtn" onclick="auth()">Sign Up</button>
      <div onclick="swap()" style="color:var(--accent); cursor:pointer; font-size:13px;" id="swapTxt">Log In instead</div>
    </div>

    <div id="mainPanel" class="hidden">
      <div id="feedView">
        <div style="padding: 15px; border-bottom: 4px solid var(--bg);">
          <input type="text" id="msgText" class="input" placeholder="Caption...">
          <!-- ADDS UPLOAD BUTTON CAPABILITIES BACK -->
          <label style="cursor:pointer; font-size:14px; font-weight:bold; color:var(--accent); display:inline-block; margin-bottom:10px;">🖼️ Choose Photo/Video
            <input type="file" id="mediaFile" accept="image/*,video/*" style="display:none;" onchange="loadImg()">
          </label>
          <div id="fileOk" style="font-size:12px; color:var(--sub); margin-bottom:10px;"></div>
          <button class="btn" onclick="post()">Share Post</button>
        </div>
        <div id="postFeed"></div>
      </div>

      <div id="profView" class="hidden" style="padding:15px;">
        <div style="display:flex; align-items:center; gap:15px;">
          <div class="circle" style="width:60px; height:60px;"></div>
          <div style="font-size:13px;">
            <div id="myUser" style="font-weight:bold; font-size:16px;">@user</div>
            <div style="color:var(--sub); margin-top:2px;">Posts: <span id="pCount" style="font-weight:bold; color:var(--txt);">0</span></div>
          </div>
        </div>
        <div class="grid" id="myGrid"></div>
      </div>

      <div id="dmPanel" class="dm-drawer">
        <div class="dm-head" onclick="toggleDM()">
          <span>💬 Direct Messages</span><span id="dmArr">▲</span>
        </div>
        <div class="dm-chat" id="chatArea">
          <div class="bubble recv">Welcome to KBpost chat!</div>
        </div>
        <div style="padding:5px; display:flex; gap:5px;">
          <input type="text" id="dmIn" class="input" style="margin:0; width:70%; padding:6px;" placeholder="Message...">
          <button class="btn" style="width:22%; margin:0; padding:6px;" onclick="sendDM()">Send</button>
        </div>
      </div>

      <div class="nav">
        <button class="nav-btn" onclick="tab('home')">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </button>
        <button class="nav-btn" onclick="tab('user')">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    let upMode = true; let rawData = ""; let count = 0;
    function swap() {
      upMode = !upMode;
      document.getElementById("modeTitle").innerText = upMode ? "Create Account" : "Welcome Back";
      document.getElementById("subBtn").innerText = upMode ? "Sign Up" : "Log In";
      document.getElementById("swapTxt").innerText = upMode ? "Log In instead" : "Sign Up instead";
    }
    function auth() {
      let mail = document.getElementById("email").value;
      if(!mail || !document.getElementById("pass").value) return alert("Fill fields!");
      document.getElementById("authPanel").classList.add("hidden");
      document.getElementById("mainPanel").classList.remove("hidden");
      document.getElementById("myUser").innerText = "@" + mail.split('@');
      document.getElementById("postFeed").innerHTML = ""; 
    }
    function toggleTheme() {
      let t = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'light' : 'dark');
    }
    function tab(name) {
      document.getElementById("feedView").classList.toggle("hidden", name !== 'home');
      document.getElementById("profView").classList.toggle("hidden", name !== 'user');
    }
    function toggleDM() {
      let d = document.getElementById("dmPanel"); d.classList.toggle("open");
      document.getElementById("dmArr").innerText = d.classList.contains("open") ? "▼" : "▲";
    }
    function sendDM() {
      let box = document.getElementById("dmIn"); let txt = box.value.trim(); if(!txt) return;
      let area = document.getElementById("chatArea");
      let b = document.createElement("div"); b.className = "bubble sent"; b.innerText = txt;
      area.appendChild(b); box.value = ""; area.scrollTop = area.scrollHeight;
    }
    function loadImg() {
      let f = document.getElementById('mediaFile').files[0]; if(!f) return;
      document.getElementById('fileOk').innerText = "📎 Selected: " + f.name;
      let r = new FileReader(); 
      r.onloadend = function() { rawData = r.result; }; 
      r.readAsDataURL(f); // Streams file into local browser space securely
    }
    function follow(btn) {
      if(btn.innerText === "Follow") {
        btn.innerText = "Following"; btn.style.background = "#eff3f4"; btn.style.color = "#0f1419";
      } else {
        btn.innerText = "Follow"; btn.style.background = "none"; btn.style.color = "var(--accent)";
      }
    }
    function like(btn) {
      let svg = btn.querySelector('svg');
      if (svg.style.fill === "rgb(249, 24, 128)") {
        svg.style.fill = "none"; svg.style.stroke = "var(--txt)";
      } else {
        svg.style.fill = "#f91880"; svg.style.stroke = "#f91880";
      }
    }
    function post() {
      let txt = document.getElementById("msgText").value;
      if (!txt && !rawData) return alert("Type a caption or pick a file first!");
      let name = document.getElementById("myUser").innerText;
      
      let html = `<div class="card"><div class="p-head"><div style="display:flex; align-items:center;"><div class="circle"></div><span class="user">${name}</span></div><button class="f-btn" onclick="follow(this)">Follow</button></div>`;
      
      let item = document.createElement("div");
      if (rawData) {
        html += `<div class="media-box">`;
        if (rawData.includes('video')) {
          html += `<video class="media" src="${rawData}" controls loop autoplay muted></video></div>`;
          item.innerHTML = `<video class="grid-img" src="${rawData}"></video>`;
        } else {
          html += `<img class="media" src="${rawData}"></div>`;
          item.innerHTML = `<img class="grid-img" src="${rawData}">`;
        }
        document.getElementById("myGrid").insertBefore(item, document.getElementById("myGrid").firstChild);
      } else {
        item.className = "grid-img"; item.style.padding = "4px"; item.style.fontSize = "10px"; item.innerText = txt;
        document.getElementById("myGrid").insertBefore(item, document.getElementById("myGrid").firstChild);
      }
      
      html += `<div class="caption"><span class="user">${name}</span> ${txt}</div>`;
      html += `<div class="actions">
        <button class="act-btn" onclick="like(this)"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></button>
        <button class="act-btn" onclick="prompt('Comment:')"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></button>
      </div></div>`;
      
      document.getElementById("postFeed").innerHTML = html + document.getElementById("postFeed").innerHTML;
      count++; document.getElementById("pCount").innerText = count;
      document.getElementById("msgText").value = ""; 
      document.getElementById("mediaFile").value = "";
      document.getElementById("fileOk").innerText = ""; rawData = "";
    }
  </script>
</body>
</html>
